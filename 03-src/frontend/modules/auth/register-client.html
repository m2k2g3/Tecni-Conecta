<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Cliente - TecniConecta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="register-client.css">
</head>
<body class="bg-dark text-light">

    <div class="container d-flex align-items-center justify-content-center min-vh-100 py-5">
        <div class="col-12 col-md-9 col-lg-7 col-xl-6">
            
            <div class="card card-tecni p-3 p-sm-4 shadow">
                <div class="card-body">
                    
                    <div class="text-center mb-4">
                        <div class="logo-box mb-2">
                            <i class="bi bi-gear-wide-connected fs-1 text-primary"></i>
                        </div>
                        <h2 class="fw-bold mb-1">
                            <span class="text-white">Tecni</span><span class="text-primary">Conecta</span>
                        </h2>
                        <p class="text-secondary small">Plataforma de Servicios Técnicos - Registro de Clientes</p>
                    </div>
                    
                    <div id="alertContainer"></div>

                    <form id="formRegister" novalidate>
                        
                        <div class="mb-3">
                            <label for="nombre" class="form-label form-label-tecni">Nombre Completo <span class="text-danger">*</span></label>
                            <input type="text" class="form-control form-control-tecni" id="nombre" placeholder="Ej. Ricardo Espitia" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="correo" class="form-label form-label-tecni">Correo Electrónico <span class="text-danger">*</span></label>
                            <input type="email" class="form-control form-control-tecni" id="correo" placeholder="correo@ejemplo.com" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="telefono" class="form-label form-label-tecni">Teléfono / Celular <span class="text-danger">*</span></label>
                            <input type="tel" class="form-control form-control-tecni" id="telefono" placeholder="3001234567" required>
                            <div class="form-text text-secondary">Entre 7 y 10 dígitos numéricos.</div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="ciudad" class="form-label form-label-tecni">Ciudad <span class="text-danger">*</span></label>
                                <input type="text" class="form-control form-control-tecni" id="ciudad" placeholder="Ej. Duitama" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="direccion" class="form-label form-label-tecni">Dirección <span class="text-danger">*</span></label>
                                <input type="text" class="form-control form-control-tecni" id="direccion" placeholder="Calle 12 # 34-56" required>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="password" class="form-label form-label-tecni">Contraseña <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <input type="password" class="form-control form-control-tecni border-end-0" id="password" placeholder="Mínimo 6 caracteres" required>
                                <button class="btn btn-eye border-start-0" type="button" id="togglePassword">
                                    <i class="bi bi-eye-slash" id="iconPassword"></i>
                                </button>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label form-label-tecni">Confirmar Contraseña <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <input type="password" class="form-control form-control-tecni border-end-0" id="confirmPassword" placeholder="Repite tu contraseña" required>
                                <button class="btn btn-eye border-start-0" type="button" id="toggleConfirmPassword">
                                    <i class="bi bi-eye-slash" id="iconConfirmPassword"></i>
                                </button>
                            </div>
                        </div>
                        
                        <button type="submit" id="btnSubmit" class="btn btn-tecni w-100 py-2 fw-semibold">
                            <span id="btnText">Registrar Cuenta</span>
                            <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"></span>
                        </button>
                    </form>
                    
                    <div class="text-center mt-4 pt-2 border-top border-secondary border-opacity-25">
                        <small class="text-secondary">¿Ya tienes una cuenta registrada? <a href="login.html" class="text-primary text-decoration-none fw-semibold">Inicia sesión</a></small>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="register-client.js"></script>
</body>
</html>
